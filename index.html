<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣扶輪人自行車協會 · 會員編號查詢</title>
<style>
  :root{
    --bg:#070b14;
    --bg2:#0d1424;
    --card:rgba(18,26,44,.72);
    --accent:#ff6b35;
    --accent2:#ff9248;
    --accent3:#ffb55c;
    --cyan:#38e1ff;
    --text:#eaf0fa;
    --muted:#7d8db0;
    --line:rgba(120,150,200,.16);
    --err:#ff6b6b;
    --ok:#5be8a0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  /* 科技感背景 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 15% 10%,rgba(255,107,53,.18),transparent 40%),
      radial-gradient(circle at 85% 90%,rgba(56,225,255,.12),transparent 45%),
      linear-gradient(160deg,#070b14 0%,#0d1424 100%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;opacity:.5;
    background-image:
      linear-gradient(rgba(120,150,200,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,200,.06) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 75%);
  }
  .scan{
    position:fixed;left:0;right:0;height:2px;z-index:0;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.4;animation:scan 7s linear infinite;
  }
  @keyframes scan{0%{top:-5%}100%{top:105%}}

  .wrap{width:100%;max-width:460px;position:relative;z-index:2;
    animation:rise .7s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .logo-zone{text-align:center;margin-bottom:22px;}
  .logo-zone img{width:190px;max-width:62%;filter:drop-shadow(0 6px 22px rgba(255,107,53,.4));}

  .card{
    background:var(--card);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);
    border-radius:22px;
    padding:34px 30px 30px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--cyan),transparent);
  }
  .corner{position:absolute;width:26px;height:26px;border:2px solid var(--accent);opacity:.55;}
  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 6px 0;}

  .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:3px;
    color:var(--cyan);border:1px solid rgba(56,225,255,.35);border-radius:30px;
    padding:5px 14px;margin-bottom:16px;background:rgba(56,225,255,.06);}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  h1{font-size:21px;font-weight:800;margin-bottom:6px;letter-spacing:.5px;line-height:1.35;
    background:linear-gradient(100deg,#fff,var(--accent3));-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:26px;line-height:1.7;}
  .sub b{color:var(--accent3);font-weight:600;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px;letter-spacing:1px;}
  .input-box{position:relative;margin-bottom:8px;}
  input{width:100%;background:rgba(7,11,20,.7);border:1px solid var(--line);
    border-radius:13px;color:var(--text);font-size:16px;padding:16px 16px;
    transition:.25s;outline:none;letter-spacing:1px;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,.15);}
  input::placeholder{color:#52617f;}
  .hint{font-size:11.5px;color:var(--muted);margin:8px 0 18px;line-height:1.6;}

  button{width:100%;border:none;border-radius:13px;padding:16px;cursor:pointer;
    font-size:15px;font-weight:800;letter-spacing:4px;color:#1a0a00;
    background:linear-gradient(120deg,var(--accent),var(--accent2),var(--accent3));
    background-size:200% 100%;transition:.3s;position:relative;overflow:hidden;}
  button:hover{background-position:100% 0;transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(255,107,53,.4);}
  button:active{transform:translateY(0);}
  button:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none;}

  .result{margin-top:22px;max-height:0;opacity:0;overflow:hidden;
    transition:.45s cubic-bezier(.2,.8,.2,1);}
  .result.show{max-height:340px;opacity:1;}
  .result-card{background:rgba(7,11,20,.6);border:1px solid var(--line);
    border-radius:15px;padding:22px;position:relative;}
  .result-card.found{border-color:rgba(91,232,160,.4);box-shadow:0 0 0 3px rgba(91,232,160,.08);}
  .result-card.none{border-color:rgba(255,107,107,.4);}
  .r-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:11px 0;border-bottom:1px dashed var(--line);}
  .r-row:last-child{border-bottom:none;}
  .r-label{color:var(--muted);font-size:12px;letter-spacing:1px;}
  .r-val{font-size:20px;font-weight:800;letter-spacing:1px;}
  .r-val.id{color:var(--accent3);font-size:23px;
    text-shadow:0 0 18px rgba(255,107,53,.5);font-variant-numeric:tabular-nums;}
  .msg{font-size:14.5px;line-height:1.6;}
  .msg.err{color:var(--err);}

  .footer{text-align:center;margin-top:20px;font-size:11.5px;color:var(--muted);
    line-height:1.8;position:relative;z-index:2;}
  .footer .lock{color:var(--ok);}

  .setup{margin-top:16px;background:rgba(7,11,20,.7);border:1px dashed var(--accent);
    border-radius:13px;padding:16px;font-size:12px;color:var(--muted);
    line-height:1.8;display:none;position:relative;z-index:2;}
  .setup.show{display:block;}
  .setup b{color:var(--accent3);} .setup code{background:rgba(255,107,53,.12);
    padding:1px 6px;border-radius:4px;color:var(--text);}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,10,0,.3);
    border-top-color:#1a0a00;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  <div class="card">
    <span class="corner tl"></span><span class="corner br"></span>
    <span class="badge"><span class="dot"></span>MEMBER ID SYSTEM</span>
    <h1>台灣扶輪人自行車協會<br>會員編號查詢系統</h1>
    <p class="sub">請輸入您的<b>身分證字號</b>或<b>統一編號</b>;<br>若無,請改輸入<b>手機號碼</b>查詢。</p>

    <div class="input-box">
      <label for="q">查詢碼 / QUERY CODE</label>
      <input id="q" type="text" placeholder="身分證 / 統編 / 手機號碼" autocomplete="off" />
    </div>
    <p class="hint">系統會自動忽略空格與大小寫差異,須輸入完整號碼。</p>

    <button id="btn" onclick="lookup()">查 詢</button>

    <div class="result" id="result"></div>
  </div>

  <p class="footer"><span class="lock">&#128274;</span> 資料經加密後端比對,僅回傳查詢者本人資訊 &middot; <span id="status">系統就緒</span></p>
  <div class="setup" id="setup"></div>
</div>

<script>
/* ====== 設定區:貼上你的 Apps Script 網頁應用程式網址 ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbwHLU8tE7p7hD_jVw16ZFZ3hcoSzZL1s5BHQqlQC2JWEg2e_kVKLmsvXHlTi8BZFFE82A/exec";
/* =========================================================== */

const btn=document.getElementById("btn");
const statusEl=document.getElementById("status");

function show(html){const b=document.getElementById("result");b.innerHTML=html;b.classList.add("show");}
function esc(s){return (s||"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

if(API_URL==="PASTE_YOUR_APPS_SCRIPT_URL_HERE"){
  statusEl.textContent="尚未設定後端";
  btn.disabled=true;
  const s=document.getElementById("setup");s.classList.add("show");
  s.innerHTML='<b>尚未設定 Apps Script 後端</b><br>請依對話中的步驟完成部署,取得網頁應用程式網址後,'+
    '用記事本打開本檔,把 <code>PASTE_YOUR_APPS_SCRIPT_URL_HERE</code> 換成該網址並存檔。';
}

async function lookup(){
  const raw=document.getElementById("q").value.trim();
  if(!raw){show('<div class="result-card none"><p class="msg err">請先輸入查詢碼。</p></div>');return;}
  btn.disabled=true;const old=btn.textContent;btn.innerHTML='<span class="spinner"></span>查詢中';
  try{
    const url=API_URL+"?q="+encodeURIComponent(raw);
    const res=await fetch(url);
    const data=await res.json();
    if(data.found){
      show('<div class="result-card found">'+
        '<div class="r-row"><span class="r-label">姓名 / NAME</span><span class="r-val">'+esc(data.name)+'</span></div>'+
        '<div class="r-row"><span class="r-label">會員編號 / MEMBER ID</span><span class="r-val id">'+esc(data.member)+'</span></div>'+
        '</div>');
    }else{
      show('<div class="result-card none"><p class="msg err">查無此資料,請確認輸入的號碼是否正確且完整。</p></div>');
    }
  }catch(e){
    show('<div class="result-card none"><p class="msg err">連線失敗,請稍後再試或聯絡管理員。</p></div>');
  }finally{
    btn.disabled=false;btn.textContent=old;
  }
}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")lookup();});
</script>
